<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>早哦早餐铺</title>

<style>
/* ==========================================
   变量 & 基础
   ========================================== */
:root {
  --bg: #fdf5f5;
  --surface: rgba(255,225,230,0.6);
  --surface-hover: rgba(255,215,220,0.8);
  --surface-solid: #ffe8ec;
  --text: #1A1A1A;
  --text-sub: #6B6B6B;
  --text-muted: #999;
  --accent: #FFB7B2;
  --accent-hover: #ffa49e;
  --border: rgba(190,150,155,0.18);
  --radius: 10px;
  --radius-lg: 18px;
  --radius-btn: 24px;
  --shadow: 0 2px 12px rgba(0,0,0,0.03), 0 4px 20px rgba(0,0,0,0.02);
  --blur-card: blur(24px);
  --blur-nav: blur(16px);
  --transition: 0.3s ease;
  --nav-h: 60px;
}
body.dark {
  --bg: #1f1418;
  --surface: rgba(30,18,22,0.6);
  --surface-hover: rgba(40,24,30,0.8);
  --surface-solid: #1f1418;
  --text: #eee;
  --text-sub: #ccc;
  --text-muted: #988;
  --border: rgba(180,140,150,0.12);
  --shadow: 0 2px 12px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.06);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif SC', 'Georgia', 'Source Han Serif SC', 'SimSun', serif;
  font-weight: 400;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  transition: color var(--transition);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  position: relative;
}
/* 壁纸背景层 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background: var(--bg);
  transition: background var(--transition);
}
body.has-wallpaper::before {
  background: var(--bg) center/cover fixed;
  background-image: inherit;
  filter: blur(8px);
  transform: scale(1.05);
}
body.has-wallpaper { background-color: transparent; }

/* ==========================================
   导航栏
   ========================================== */
.nav-bar {
  position: sticky; top:0; z-index:50;
  height: var(--nav-h);
  background: var(--surface);
  backdrop-filter: var(--blur-nav);
  -webkit-backdrop-filter: var(--blur-nav);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  transition: background var(--transition);
}
.nav-left { display:flex; align-items:center; gap:10px; }
.nav-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; }
.nav-name { font-size:18px; font-weight:600; color:var(--text); }
.nav-right { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.nav-btn {
  background: none; border: none; color: var(--text-sub);
  font-size: 15px; font-family: inherit; cursor: pointer;
  padding: 8px 14px; border-radius: var(--radius);
  transition: color 0.2s, background 0.2s;
}
.nav-btn:hover, .nav-btn.active { color: var(--text); background: var(--surface-hover); filter:brightness(0.95); }
.nav-dark {
  background: none; border: none; font-size: 16px; cursor: pointer;
  padding: 6px 8px; border-radius: var(--radius);
  margin-left: 8px; transition: background 0.2s;
}
.nav-dark:hover { background: var(--surface-hover); }

/* ==========================================
   页面容器
   ========================================== */
.page { display:none; max-width:1080px; margin:0 auto; padding:36px 24px 60px; }
.page.active { display:block; }

/* ==========================================
   主页 — 左右两栏
   ========================================== */
.home-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  align-items: stretch;
}
.profile-card {
  background: var(--surface);
  backdrop-filter: var(--blur-card);
  -webkit-backdrop-filter: var(--blur-card);
  border-radius: var(--radius-lg);
  padding: 28px 28px 20px; border: 2px solid var(--border);
  box-shadow: var(--shadow);
  transition: background var(--transition), border var(--transition), box-shadow var(--transition);
}
.profile-top { display:flex;align-items:center;gap:16px;margin-bottom:22px; }
.profile-avatar { width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0; }
.profile-info { display:flex; flex-direction:column; gap:4px; }
.profile-name { font-size:24px; font-weight:700; }
.profile-sig { font-size:13px; color:var(--text-sub); }
.profile-bottom { display:flex;align-items:center;justify-content:space-between; }
.profile-stats { display:flex; gap:20px;align-items:center; }
.stat-item { display:flex; flex-direction:column; align-items:center; }
.stat-num { font-size:22px; font-weight:700; color:#8b3a3a; }
body.dark .stat-num { color:#e8b4b6; }
.stat-label { font-size:11px; color:var(--text-muted); }
.profile-links { display:flex; gap:6px;align-items:center; }
.profile-links a { display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;transition:transform 0.2s,opacity 0.2s; }
.profile-links a:hover { transform:scale(1.1);opacity:0.8; }
.profile-links a img { width:26px;height:26px;border-radius:5px; }
.visualizer-bar { margin-top:24px;width:100%;height:80px;background:linear-gradient(135deg,rgba(255,200,205,0.78) 0%,rgba(255,185,195,0.78) 30%,rgba(255,195,205,0.78) 60%,rgba(255,180,195,0.78) 100%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:2px solid rgba(0,0,0,0.06);border-radius:var(--radius-lg);overflow:hidden;display:flex;align-items:center;padding:0 20px;box-sizing:border-box;box-shadow:0 2px 12px rgba(0,0,0,0.04),0 4px 20px rgba(0,0,0,0.02); }
.vis-left { width:25%;height:100%;display:flex;align-items:center;flex-shrink:0; }
.vis-left canvas { width:100%;height:30px;display:block;contain:layout paint; }
body.dark .visualizer-bar { background:linear-gradient(135deg,rgba(45,20,24,0.78) 0%,rgba(35,15,20,0.78) 30%,rgba(40,22,26,0.78) 60%,rgba(35,15,20,0.78) 100%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:rgba(255,255,255,0.06);box-shadow:0 2px 12px rgba(0,0,0,0.18),0 4px 20px rgba(0,0,0,0.08); }
body.dark .vis-mid { color:#e8c4c6; }
body.dark #live-clock { color:#e8c4c6; }
body.dark .vis-right { border-left-color:rgba(180,140,140,0.2); }
.vis-mid { flex:1;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#8b4a4c;white-space:nowrap;letter-spacing:2px; }
.vis-right { flex-shrink:0;padding-left:16px;border-left:1px solid rgba(140,100,100,0.2);display:flex;align-items:center; }
#live-clock { color:#8b4a4c;font-size:26px;font-weight:400;font-family:'SF Mono','Cascadia Code','Consolas',monospace;letter-spacing:2px; }
.welcome-card {
  background: var(--surface);
  backdrop-filter: var(--blur-card);
  -webkit-backdrop-filter: var(--blur-card);
  border-radius: var(--radius-lg);
  padding: 28px 24px; border: 2px solid var(--border);
  box-shadow: var(--shadow);
  text-align: center;
  transition: background var(--transition), border var(--transition), box-shadow var(--transition);
}
#home-player .playlist-select { width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;cursor:pointer; }
#home-player .player-cover { margin:0 auto 10px; }
#home-player .player-controls { justify-content:center; }
.home-songlist-btn { background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:4px;transition:color 0.2s; }
.home-songlist-btn:hover { color:var(--text); }
.home-songlist-popup { display:none;position:fixed;width:220px;max-height:60vh;overflow-y:auto;background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.15); }
.home-songlist-popup.show { display:block; }
.home-songlist-popup .playlist-item { padding:6px 10px;cursor:pointer;font-size:11px;transition:background 0.1s; }
.home-songlist-popup .playlist-item:hover,
.home-songlist-popup .playlist-item.playing { background:var(--surface-hover); }
#home-player { overflow:visible; }

/* ==========================================
   卡片 & 项目
   ========================================== */
.card { background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card); border:2px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); transition:background var(--transition),border var(--transition),box-shadow var(--transition); }
.search-bar { width:100%; padding:10px 16px; border:1px solid var(--border); border-radius:var(--radius); font-size:14px; font-family:inherit; background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--text); outline:none; transition:background var(--transition),border var(--transition); }
.project-add-btn { padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:filter 0.2s; }
.project-add-btn:hover { filter:brightness(0.9); }
.project-md-btn { padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;color:var(--text-sub);transition:all 0.2s; }
.project-md-btn:hover { border-color:var(--accent);color:var(--accent); }
.search-bar:focus { border-color: var(--accent); }
.project-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
.project-card { background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; cursor:pointer; transition:all 0.2s;position:relative; }
.project-card:hover { background:var(--surface-hover); transform:translateY(-2px); }
.project-card .proj-edit { position:absolute;top:8px;right:8px;background:none;border:none;font-size:12px;cursor:pointer;color:var(--text-muted);opacity:0;transition:opacity 0.2s; }
.project-card:hover .proj-edit { opacity:0.5; }
.project-card .proj-edit:hover { opacity:1; }
.project-card .proj-del { position:absolute;top:28px;right:8px;background:none;border:none;font-size:12px;cursor:pointer;color:var(--text-muted);opacity:0;transition:opacity 0.2s; }
.project-card:hover .proj-del { opacity:0.5; }
.project-card .proj-del:hover { opacity:1;color:#e55; }
.project-card h3 { font-size:16px; margin-bottom:6px; }
.project-card p { font-size:13px; color:var(--text-sub); margin-bottom:10px; line-height:1.5; }
.project-tags { display:flex; gap:6px; flex-wrap:wrap; }
.project-tag { font-size:11px; padding:2px 8px; background:var(--surface-hover); border-radius:20px; color:var(--text-sub); }
.project-detail { display:none; }
.project-detail.active { display:block; }
.project-back { background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer; padding:0; margin-bottom:16px; font-family:inherit; }
.project-back:hover { text-decoration:underline; }
.project-content { font-size:14px; line-height:1.8; color:var(--text); }
.project-content h1,.project-content h2,.project-content h3 { margin:16px 0 8px; }
.project-content p { margin-bottom:10px; color:var(--text-sub); }
.project-content code { background:var(--surface-hover); padding:2px 6px; border-radius:2px; font-size:13px; }
.project-content pre { background:var(--surface-hover); padding:16px; border-radius:var(--radius); overflow-x:auto; margin-bottom:10px; }

/* ==========================================
   音乐页面 — MP3 上传
   ========================================== */
.music-layout { display:grid; grid-template-columns: 280px 1fr; gap:20px; align-items:start; }
.playlist-select-row { display:flex;gap:4px;margin-bottom:10px; }
.playlist-select { flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;cursor:pointer; }
.playlist-new-btn { padding:6px 10px;background:none;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;cursor:pointer;color:var(--text-sub);font-family:inherit;transition:all 0.2s; }
.playlist-new-btn:hover { border-color:var(--accent);color:var(--accent); }
.music-upload-btn {
  display:block;text-align:center;padding:10px;margin-bottom:12px;
  background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card);
  border:2px dashed var(--border); border-radius:var(--radius);
  font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer;font-family:inherit;
  transition:border-color 0.2s,color 0.2s;
}
.music-upload-btn:hover { border-color:var(--accent); color:var(--accent); filter:brightness(0.92); }
.playlist-panel { background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
.playlist-panel h3 { font-size:14px; margin-bottom:10px; }
.playlist-item { display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:var(--radius);cursor:pointer;transition:background 0.15s; }
.playlist-item:hover,.playlist-item.playing { background:var(--surface-hover); }
.playlist-item .pl-cover { width:32px;height:32px;border-radius:var(--radius);background:var(--surface-hover);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
.playlist-item .pl-info { flex:1;min-width:0; }
.playlist-item .pl-name { font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.playlist-item .pl-artist { font-size:10px;color:var(--text-muted); }
.playlist-item .pl-del { background:none;border:none;font-size:10px;color:var(--text-muted);cursor:pointer;padding:2px;flex-shrink:0; }
.playlist-item .pl-del:hover { color:#e55; }

.player-panel { background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card); border:2px solid var(--border); border-radius:var(--radius-lg); padding:32px; text-align:center; box-shadow:var(--shadow); }
.playlist-panel { background:var(--surface); backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card); border:2px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); }
.playlist-comments-panel { border:2px solid var(--border); box-shadow:var(--shadow); }
.note-card, .project-card { border-width:2px; box-shadow:var(--shadow); }
.about-card { border-width:2px; box-shadow:var(--shadow); }
.note-detail-content, .note-detail-comments { border:2px solid var(--border); box-shadow:var(--shadow); }
.player-cover { width:140px;height:140px;border-radius:var(--radius-lg);background:var(--surface-hover);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:48px; }
.player-title { font-size:16px;font-weight:600;margin-bottom:2px; }
.player-artist { font-size:12px;color:var(--text-sub);margin-bottom:8px; }
.player-desc-row { display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:8px;min-height:18px; }
.player-desc { font-size:11px;color:var(--text-muted);line-height:1.5;flex:1; }
.player-desc input { width:100%;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);outline:none; }
.desc-edit-btn { background:none;border:none;font-size:11px;cursor:pointer;color:var(--text-muted);padding:2px 4px;opacity:0.4;transition:opacity 0.2s; }
.desc-edit-btn:hover { opacity:0.8; }
.player-seek { display:flex;align-items:center;gap:8px;margin-bottom:14px; }
.seek-time { font-size:10px;color:var(--text-muted);min-width:32px; }
.seek-bar { flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer; }
.seek-bar::-webkit-slider-thumb { -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer; }
.seek-bar::-moz-range-thumb { width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:none; }
.player-controls { display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:16px; }
.player-btn {
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);
  width:42px;height:42px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background 0.2s,color 0.2s;
  position:relative;
}
.player-btn:hover { background:var(--surface-hover); }
.player-btn.play-btn { width:52px;height:52px;font-size:28px; }
.player-btn.play-btn:hover { background:var(--surface-hover); }
.player-btn.active { color:var(--accent); }
.play-icon { width:28px;height:28px;vertical-align:middle;transition:filter 0.3s; }
body.dark .play-icon { filter:invert(1); }
.playlist-comments-panel { text-align:left;margin-top:20px; }
.playlist-comments-panel .comment-item { padding:6px 0;font-size:13px; }
.playlist-comments-panel .comment-item:not(:last-child) { border-bottom:1px solid var(--border); }
.playlist-comments-panel .comment-author { font-size:12px;font-weight:600;margin-bottom:2px; }
.playlist-comments-panel .comment-content { font-size:12px;color:var(--text-sub);line-height:1.5; }
.mode-icon { width:22px;height:22px;vertical-align:middle;transition:opacity 0.2s;opacity:0.45; }
.player-btn.active .mode-icon { opacity:1; }
body.dark .mode-icon { filter:invert(1); }
.player-volume { display:inline-flex;align-items:center;gap:2px; }
.player-volume .player-btn { width:36px;height:36px;font-size:14px; }
.volume-slider {
  -webkit-appearance:none;appearance:none;width:80px;height:3px;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;vertical-align:middle;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--accent);cursor:pointer;transition:transform 0.15s;
}
.volume-slider::-webkit-slider-thumb:hover { transform:scale(1.2); }
.volume-slider::-moz-range-thumb { width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:none; }

/* ==========================================
   照片墙
   ========================================== */
.photo-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px; }
.photo-add-box {
  aspect-ratio:1; border:2px dashed var(--border); border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:32px; color:var(--text-muted); transition:border-color 0.2s,color 0.2s;
  background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.photo-add-box:hover { border-color:var(--accent); color:var(--accent); filter:brightness(0.95); }
.photo-item { aspect-ratio:1; border-radius:var(--radius); overflow:hidden; cursor:pointer; background:var(--surface-hover); transition:transform 0.2s; }
.photo-item:hover { transform:scale(1.02); }
.photo-item img { width:100%;height:100%;object-fit:cover;display:block; }
.lightbox { display:none; position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0.9);align-items:center;justify-content:center; }
.lightbox.show { display:flex; }
.lightbox img { max-width:90vw;max-height:90vh;border-radius:4px; }
.lightbox-close { position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer; }
.context-menu { display:none;position:fixed;z-index:150;background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;min-width:100px;box-shadow:0 4px 16px rgba(0,0,0,0.1); }
.context-menu.show { display:block; }
.context-menu button { display:block;width:100%;padding:8px 16px;border:none;background:none;font-size:13px;font-family:inherit;color:var(--text);cursor:pointer;text-align:center;transition:background 0.15s; }
.context-menu button:hover { background:rgba(128,128,128,0.15); }
.context-menu button.danger { color:var(--text); }
.context-menu button.danger:hover { background:rgba(128,128,128,0.15); color:var(--text); }

/* ==========================================
   随笔
   ========================================== */
.notes-input-area { display:flex;gap:10px;margin-bottom:20px; }
.notes-input {
  flex:1; padding:12px 16px; border:1px solid var(--border);
  border-radius:var(--radius); font-size:14px; font-family:inherit;
  background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  color:var(--text); resize:none; outline:none;
  transition:background var(--transition),border var(--transition);
}
.notes-input:focus { border-color:var(--accent); }

const SB_URL = 'https://tlhgumdobwxzfamndfka.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsaGd1bWRvYnd4emZhbW5kZmthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjAwMzUsImV4cCI6MjA5NjgzNjAzNX0.d9B49UmV9x8St5rkiknIoK8Kjdnif52lS0y4FSL1K9Y';
const SB_H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
let SB_TOKEN = ''; // 登录后的 JWT

function sbHeaders() {
  const h = { ...SB_H };
  if (SB_TOKEN) h.Authorization = 'Bearer ' + SB_TOKEN;
  return h;
}

// 数据库操作
function _q(params) { return Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&'); }
async function _fetch(method, table, params, body) {
  const qs = params ? '?' + _q(params) : '';
  const opts = { method, headers: sbHeaders() };
  if (body) { opts.body = JSON.stringify(body); opts.headers['Prefer'] = 'return=representation'; }
  const r = await fetch(SB_URL + '/rest/v1/' + table + qs, opts);
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0, 80)); }
  if (method === 'DELETE') return null;
  if (method === 'PATCH') opts.headers['Prefer'] = 'return=representation';
  return await r.json();
}
function _cnt(table, params) {
  const qs = (params ? '?' + _q(params) + '&' : '?') + 'limit=0';
  return fetch(SB_URL + '/rest/v1/' + table + qs, { headers: { ...sbHeaders(), Prefer: 'count=exact' } })
    .then(r => ({ count: parseInt(r.headers.get('content-range')?.split('/')[1] || '0') }));
}
function _authFetch(path, opts) {
  return fetch(SB_URL + path, opts).then(r => r.json().then(d => ({ data: d, error: r.ok ? null : d })));
}

async function checkAuth() {
  SB_TOKEN = localStorage.getItem('sb_token') || '';
  if (SB_TOKEN) {
    const r = await fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_TOKEN } });
    if (r.ok) {
      currentUser = await r.json();
      isOwner = (currentUser.email === OWNER_EMAIL);
      await loadProfile();
    } else { SB_TOKEN = ''; localStorage.removeItem('sb_token'); currentUser = null; isOwner = false; userProfile = null; }
  } else { currentUser = null; isOwner = false; userProfile = null; }
  document.querySelectorAll('.owner-only-el').forEach(el => el.style.display = isOwner ? '' : 'none');
  updateAuthUI(); renderAll();
}

async function loadProfile() {
  if (!currentUser) return;
  try {
    const pd = await _fetch('GET', 'profiles', { id: 'eq.' + currentUser.id, limit: '1' });
    if (pd && pd.length) { userProfile = pd[0]; return; }
  } catch(e) { /* 可能 profiles 表不存在 */ }
  // 没有 profile 就自动创建
  userProfile = { display_name: currentUser.email?.split('@')[0] || '用户', avatar_url: '' };
  try { await _fetch('POST', 'profiles', null, { id: currentUser.id, display_name: userProfile.display_name, avatar_url: '' }); } catch(e) {}
}

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const nickname = document.getElementById('auth-nickname').value.trim();
  if (!email || !password) { document.getElementById('auth-err').textContent = '请填写邮箱和密码'; return; }

  try {
    if (authMode === 'register') {
      const r = await fetch(SB_URL + '/auth/v1/signup', { method: 'POST', headers: SB_H, body: JSON.stringify({ email, password }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.msg || d.message || '注册失败');
      if (d.user) {
        SB_TOKEN = d.session?.access_token || '';
        if (SB_TOKEN) localStorage.setItem('sb_token', SB_TOKEN);
        await _fetch('POST', 'profiles', null, { id: d.user.id, display_name: nickname || '用户', avatar_url: '' });
        toast('✅ 注册成功');
      }
    } else {
      const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: SB_H, body: JSON.stringify({ email, password }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error_description || d.msg || '登录失败');
      SB_TOKEN = d.access_token;
      localStorage.setItem('sb_token', SB_TOKEN);
    }
    closeAuth();
    await checkAuth();
    if (currentUser) toast('✅ 已登录');
    else toast('⚠️ ' + (authMode === 'register' ? '注册' : '登录') + '后获取用户信息失败，请重试');
  } catch (err) {
    document.getElementById('auth-err').textContent = err.message || '操作失败';
  }
});

// Supabase Storage
async function sbUpload(bucket, path, blob) {
  const r = await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'x-upsert': 'true' },
    body: blob
  });
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0,80)); }
  return `${SB_URL}/storage/v1/object/public/${bucket}/${path}`;
}
async function sbListObjects(bucket) {
  const r = await fetch(`${SB_URL}/storage/v1/object/list/${bucket}`, {
    method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ prefix: '', limit: 100, offset: 0 })
  });
  if (!r.ok) { console.error('list failed', bucket, r.status, await r.text()); return []; }
  return await r.json();
}
async function sbDeleteStorage(bucket, path) {
  const h = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
  await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}`, { method: 'DELETE', headers: h });
}

// ==========================================
// IndexedDB 数据库
// ==========================================
const DB_NAME = 'zao-db'; let DB_VER = 5;
let idb = null;
function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'name' });
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('wallpapers')) db.createObjectStore('wallpapers', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('songs')) { db.createObjectStore('songs', { keyPath: 'id', autoIncrement: true }); }
      if (!db.objectStoreNames.contains('playlists')) { const ps = db.createObjectStore('playlists', { keyPath: 'id', autoIncrement: true }); ps.createIndex('time', 'time'); }
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror = e => reject(e.target.error);
  });
}
function idbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function idbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Toast 轻提示
// ==========================================
let toastTimer = null;
function toast(msg, dur) {
  dur = dur || 2500;
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast-msg'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ---- 渲染面板缩略图 ----
async function renderPanel() {
  // 清理旧缩略图 URL
  wpThumbUrls = [];
  const d2 = await sbListObjects('wallpapers');
  wpRecords = (d2 || []).filter(f => !f.name.startsWith('.')).map(f => ({ id: f.name, name: f.name, time: new Date(f.created_at).getTime(), url: SB_URL + '/storage/v1/object/public/wallpapers/' + f.name }));
  wpRecords.sort((a, b) => b.time - a.time);
  const activeId = LS.get('activeWpId', null);
  wpGrid.innerHTML = wpRecords.map(r => {
    const isActive = r.id === activeId;
    return '<div class="wp-item' + (isActive ? ' active' : '') + '" data-id="' + r.id + '"><img src="' + r.url + '" alt=""><span class="wp-check">✅</span>' + (isOwner ? '<button class="wp-del" data-del="' + r.id + '">✕</button>' : '') + '</div>';
  }).join('') || '<div style="grid-column:1/-1;font-size:12px;color:var(--text-muted);text-align:center;padding:24px;">还没有壁纸</div>';

  // 点击缩略图 → 应用壁纸
  wpGrid.querySelectorAll('.wp-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('wp-del')) return;
      const id = el.dataset.id;
      applyWallpaper(id);
      closePanel();
    });
  });
  // 删除按钮
  if (isOwner) {
    wpGrid.querySelectorAll('.wp-del').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        deleteWallpaper(btn.dataset.del);
      });
    });
  }
}

  wallpaperUrl = record.url;
  document.body.style.backgroundImage = 'url(' + wallpaperUrl + ')';
  document.body.classList.add('has-wallpaper');
  LS.set('activeWpId', id);
}

// ---- 删除壁纸 ----
async function deleteWallpaper(id) {
  await sbDeleteStorage('wallpapers', id);
  if (LS.get('activeWpId') === id) {
    if (wallpaperUrl) URL.revokeObjectURL(wallpaperUrl);

wpUpload.addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    try {
      const blob = await compressBlob(f);
      const path = 'wp_' + Date.now() + '.jpg';
      await sbUpload('wallpapers', path, blob);
    } catch (err) { toast('⚠️ 壁纸上传失败: ' + (err.message || '请检查Supabase Storage权限')); }
  }
  e.target.value = '';
  renderPanel();
});

// 压缩图片为 Blob
function compressBlob(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function() {
      img.onerror = reject;
      img.onload = function() {
        let w = img.width, h = img.height;
        const maxW = 1920;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('blob fail')), 'image/jpeg', 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function md2html(md) {
  return md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
    .replace(/\n/g,'<br>');
}

let audioCtx = null, analyser = null, visAnimId = null;
const SMOOTH = new Array(32).fill(0);
function initVisualizer() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}
function drawVisualizer() {
  const canvas = document.getElementById('visualizer-canvas');
  if (!canvas || canvas.offsetParent === null) { visAnimId = requestAnimationFrame(drawVisualizer); return; }
  const ctx = canvas.getContext('2d');
  const dpr = devicePixelRatio;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const N = 12, gap = 4;
  const barW = (w - gap * (N - 1)) / N;
  ctx.fillStyle = document.body.classList.contains('dark') ? '#e8b4b6' : '#d4787a';
  if (analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const len = data.length;
    const lo = Math.floor(len * 0.05);  // 从 5% 起
    const hi = Math.floor(len * 0.7);   // 到 70% 止，截掉几乎不动的极高频
    const range = hi - lo;
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1); // 0..1
      const idx = lo + Math.floor(range * Math.pow(t, 1.8)); // 指数偏向右，给右侧更多 bins
      const w = Math.max(1, Math.floor(range / N));
      let sum = 0;
      for (let j = idx; j < Math.min(hi, idx + w); j++) sum += data[j] || 0;
      const raw = sum / w / 255;
      SMOOTH[i] = SMOOTH[i] * 0.7 + raw * 0.3;
    }
  }
  for (let i = 0; i < N; i++) {
    const bh = Math.max(2, SMOOTH[i] * h * 0.85);
    const x = i * (barW + gap);
    const y = h - bh;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, bh, 3);
    ctx.fill();
  }
  visAnimId = requestAnimationFrame(drawVisualizer);
}

// 时钟 + 问候语
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const t = [h, now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  const el = document.getElementById('live-clock');
  if (el) el.textContent = t;
  const greet = document.getElementById('greeting-text');
  if (greet) {
    if (h < 6) greet.textContent = '夜深了 🌙';
    else if (h < 9) greet.textContent = '早上好 🌅';
    else if (h < 12) greet.textContent = '上午好 ☀️';
    else if (h < 14) greet.textContent = '中午好 🌞';
    else if (h < 18) greet.textContent = '下午好 🌤️';
    else greet.textContent = '晚上好 🌆';
  }
}
setInterval(updateClock, 1000);

let photoRecords = [];     // [{id, blob, time}]
let photoUrls = [];        // 对应的 object URLs

async function loadPhotos() {
  photoRecords = []; photoUrls = [];
  try {
    const data = await sbListObjects('photos');
    photoRecords = (data || []).filter(f => !f.name.startsWith('.')).map(f => ({ id: f.id, name: f.name, time: new Date(f.created_at).getTime() }));
    photoRecords.sort((a,b) => b.time - a.time);
    photoUrls = photoRecords.map(f => SB_URL + '/storage/v1/object/public/photos/' + f.name);
  } catch(e) {}
}
let ctxTargetIdx = null;
const ctxMenu = document.getElementById('context-menu');

function renderPhotos() {
  const grid = document.getElementById('photo-grid');
  let html = isOwner ? '<div class="photo-add-box" id="photo-add-box">＋</div>' : '';
  html += photoRecords.map((r, i) =>
    `<div class="photo-item" data-idx="${i}"><img src="${photoUrls[i]}" alt="照片"></div>`
  ).join('');
  if (!html) { grid.innerHTML = '<div class="photo-empty" style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 0;font-size:14px;">还没有照片</div>'; return; }
  grid.innerHTML = html;
  if (isOwner) document.getElementById('photo-add-box').addEventListener('click', () => document.getElementById('photo-input').click());

  grid.querySelectorAll('.photo-item').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('lightbox-img').src = photoUrls[+el.dataset.idx];
      document.getElementById('lightbox').classList.add('show');
    });
    if (isOwner) {
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        ctxTargetIdx = +el.dataset.idx;
        ctxMenu.style.left = e.clientX + 'px';
        ctxMenu.style.top = e.clientY + 'px';
        ctxMenu.classList.add('show');
      });
    }
  });
}

// 随笔（Supabase 云端 + 点赞评论）

let notes = [];

async function loadNotes() {
  try {
    const data = await _fetch('GET', 'notes', { order: 'created_at.desc' });
    notes = data || [];
  } catch(e) { notes = []; }
}
let currentDetailNoteId = null;

async function renderNotes() {
  const grid = document.getElementById('notes-grid');
  const visitorId = getVisitorId();

  if (!notes.length) {
    grid.innerHTML = '<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:40px 0;grid-column:1/-1;">还没有随笔，写点什么吧</p>';
    updateStats();
    return;
  }

  let html = '';
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    const noteId = String(n.id);
    const preview = n.content.length > 100 ? n.content.slice(0, 100) + '...' : n.content;
    const [{ count: likeCount }, likedData] = await Promise.all([
      _cnt('likes', { note_id: 'eq.' + noteId }),
      _fetch('GET', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId, limit: '1' }),
    ]);
    const liked = !!(likedData && likedData.length);
    html += `
    <div class="note-card" data-note-id="${noteId}" data-idx="${i}">
      <div class="note-card-preview">${escHtml(preview)}</div>
      <div class="note-card-footer">
        <span>${escHtml(n.author||'匿名')} · ${fmtTime(n.created_at||n.time)}</span>
        <span class="note-card-social">
          <span class="like-btn${liked?' liked':''}" data-note="${noteId}">${liked?'❤️':'🤍'} ${likeCount||0}</span>
          <span>💬</span>
        </span>
      </div>
    </div>`;
  }
  grid.innerHTML = html;

  // 点卡片 → 详情页
  grid.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.like-btn')) return; // 不拦截点赞
      showNoteDetail(card.dataset.noteId, +card.dataset.idx);
    });
  });

  // 点赞
  grid.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', async function(e) {
      e.stopPropagation();
      const noteId = this.dataset.note;
      const lr = await _fetch('GET', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId, limit: '1' });
      if (lr && lr.length) { await _fetch('DELETE', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId }); }
      else { await _fetch('POST', 'likes', null, { note_id: noteId, user_id: visitorId }); }
      renderNotes();
    });
  });

  updateStats();
}

async function showNoteDetail(noteId, idx) {
  currentDetailNoteId = noteId;
  document.getElementById('notes-grid-view').style.display = 'none';
  document.getElementById('notes-detail-view').style.display = 'block';

  const n = notes[idx];
  const visitorId = getVisitorId();
  const [{ count: likeCount }, likedData2] = await Promise.all([
    _cnt('likes', { note_id: 'eq.' + noteId }),
    _fetch('GET', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId, limit: '1' }),
  ]);
  const liked = !!(likedData2 && likedData2.length);

  const delBack = "document.getElementById('notes-back').click()";
  document.getElementById('note-detail-content').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
      '<span style="font-size:12px;color:var(--text-muted);">' + escHtml(n.author||'匿名') + ' · ' + fmtTime(n.created_at||n.time) + '</span>' +
      '<span style="display:flex;gap:6px;">' +
        '<button class="like-btn' + (liked ? ' liked' : '') + '" id="detail-like-btn">' + (liked ? '❤️' : '🤍') + ' <span>' + (likeCount || 0) + '</span></button>' +
        (isOwner ? '<button onclick="editNote(' + idx + ')" style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;">编辑</button><button onclick="deleteNote(' + idx + ');' + delBack + ';" style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;">删除</button>' : '') +
      '</span>' +
    '</div>' +
    '<div style="white-space:pre-wrap;line-height:1.8;">' + escHtml(n.content) + '</div>' +
    '<div class="note-edit-area" id="note-edit-' + idx + '" style="margin-top:10px;">' +
      '<textarea id="note-ta-' + idx + '">' + escHtml(n.content) + '</textarea>' +
      '<button onclick="saveNoteEdit(' + idx + ')">保存</button>' +
    '</div>';

  // 点赞
  document.getElementById('detail-like-btn').addEventListener('click', async function() {
    const lrd = await _fetch('GET', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId, limit: '1' });
    if (lrd && lrd.length) { await _fetch('DELETE', 'likes', { note_id: 'eq.' + noteId, user_id: 'eq.' + visitorId }); }
    else { await _fetch('POST', 'likes', null, { note_id: noteId, user_id: visitorId }); }
    showNoteDetail(noteId, idx);
  });

  // 评论区
  const commentArea = document.getElementById('note-detail-comments');
  commentArea.innerHTML = `
    <h3>💬 评论</h3>
    <div id="detail-comment-list"></div>
    <div class="comment-input-row">
      <input type="text" placeholder="写评论..." id="detail-comment-input" maxlength="200">
      <button id="detail-comment-submit">发送</button>
    </div>
  `;
  await loadDetailComments(noteId);
  document.getElementById('detail-comment-submit').addEventListener('click', async () => {
    const input = document.getElementById('detail-comment-input');
    const content = input.value.trim();
    if (!content) return;
    await _fetch('POST', 'comments', null, { note_id: noteId, content, author: (userProfile?.display_name || '匿名') });
    input.value = '';
    await loadDetailComments(noteId);
  });
}

async function loadDetailComments(noteId) {
  const el = document.getElementById('detail-comment-list');
  if (!el) return;
  const data = await _fetch('GET', 'comments', { note_id: 'eq.' + noteId, order: 'created_at.asc' });
  el.innerHTML = (data || []).map(c => `
    <div class="comment-item">
      <div class="comment-body">
        <div class="comment-author">${escHtml(c.author||'匿名')}</div>
        <div class="comment-content">${escHtml(c.content)}</div>
        <div class="comment-time">${fmtTime(new Date(c.created_at).getTime())}</div>
      </div>
      ${isOwner ? '<button class="comment-del" onclick="deleteDetailComment('+c.id+',\''+noteId+'\')">✕</button>' : ''}
    </div>`).join('') || '<p style="color:var(--text-muted);font-size:13px;">暂无评论</p>';
}

async function deleteDetailComment(commentId, noteId) {
  await _fetch('DELETE', 'comments', { id: 'eq.' + commentId });
  await loadDetailComments(noteId);
}
window.deleteDetailComment = deleteDetailComment;

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts) { const d=ts ? new Date(ts) : new Date(); if(isNaN(d.getTime()))return''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

document.getElementById('notes-submit').addEventListener('click', async () => {
  const input = document.getElementById('notes-input');
  const content = input.value.trim(); if (!content) return;
  await _fetch('POST', 'notes', null, { content, author: (userProfile?.display_name || '匿名'), created_at: new Date().toISOString() });
  input.value = ''; await loadNotes(); renderNotes();
});
function editNote(i) {
  document.getElementById('note-edit-' + i).style.display = 'block';
}
async function saveNoteEdit(i) {
  const ta = document.getElementById('note-ta-' + i);
  const n = notes[i]; if (!n) return;
  const content = ta.value.trim(); if (!content) { await deleteNote(i); return; }
  await _fetch('PATCH', 'notes', { id: 'eq.' + n.id }, { content });
  await loadNotes();
  const newId = notes[i] ? String(notes[i].id) : null;
  if (newId) showNoteDetail(newId, i);
}
async function deleteNote(i) {
  const n = notes[i]; if (!n) return;
  await _fetch('DELETE', 'notes', { id: 'eq.' + n.id });
  await loadNotes(); renderNotes();
}
